apiVersion: v1
kind: Pod
metadata:
  name: multitool-pod
  labels:
    app: multitool-pod
spec:
  containers:
    - name: multitool
      image: praqma/network-multitool:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: HTTP_PORT
          value: "8080"
      ports:
        - containerPort: 8080
          name: multitool-pod